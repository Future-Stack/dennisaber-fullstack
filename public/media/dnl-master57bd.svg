<svg width="100%" viewBox="80 40 520 472" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Dennis-Navigationslogik Mastergrafik</title>
  <desc>Vierfarbiger Phasen-Ring mit Pills: Wahrnehmen (Blau), Einordnen (Grün), Entscheiden (Orange), Handeln (Rot). Goldbalken mit Slogan ORIENTIERUNG SCHLÄGT PLAN.</desc>

  <rect x="80" y="40" width="520" height="472" fill="#FFFFFF"/>

  <!-- Bogenpfade -->
  <path d="M265.4,141.5 A130,130 0 0,1 414.6,141.5" fill="none" stroke="#2460A0" stroke-width="30" stroke-linecap="round"/>
  <path d="M446.5,173.4 A130,130 0 0,1 446.5,322.6" fill="none" stroke="#4A7A2A" stroke-width="30" stroke-linecap="round"/>
  <path d="M414.6,354.5 A130,130 0 0,1 265.4,354.5" fill="none" stroke="#DC7814" stroke-width="30" stroke-linecap="round"/>
  <path d="M233.5,322.6 A130,130 0 0,1 233.5,173.4" fill="none" stroke="#C83828" stroke-width="30" stroke-linecap="round"/>

  <!-- Zentrumskreis -->
  <circle cx="340" cy="248" r="72" fill="#0C0C0C"/>

  <!-- Pill WAHRNEHMEN -->
  <rect x="270" y="64" width="140" height="22" rx="11" fill="#2460A0"/>
  <text x="340" y="79" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" letter-spacing="2">WAHRNEHMEN</text>

  <!-- Pill EINORDNEN -->
  <rect x="464" y="237" width="116" height="22" rx="11" fill="#4A7A2A"/>
  <text x="522" y="252" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" letter-spacing="2">EINORDNEN</text>

  <!-- Pill ENTSCHEIDEN -->
  <rect x="270" y="410" width="140" height="22" rx="11" fill="#DC7814"/>
  <text x="340" y="425" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" letter-spacing="2">ENTSCHEIDEN</text>

  <!-- Pill HANDELN -->
  <rect x="100" y="237" width="100" height="22" rx="11" fill="#C83828"/>
  <text x="150" y="252" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" letter-spacing="2">HANDELN</text>

  <!-- Goldbalken -->
  <rect x="200" y="460" width="280" height="32" rx="4" fill="#B8A050"/>
  <text x="340" y="481" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="11" fill="#130F00" letter-spacing="3">ORIENTIERUNG SCHLÄGT PLAN</text>

</svg>
